// ---------------------------------------------------------------- input
const keys = {}; let pressedQ = {}, releasedQ = {};
const BIND = {
  left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], up:['KeyW','ArrowUp'], down:['KeyS','ArrowDown'],
  jump:['Space','KeyZ'], shoot:['KeyJ','KeyX','Mouse0'], dash:['KeyK','KeyC','ShiftLeft','ShiftRight','Mouse2'],
  act:['KeyE','Enter','NumpadEnter'], map:['KeyM','Tab'], pause:['Escape','KeyP'], newg:['KeyN'],
  ok:['Enter','Space','KeyJ','KeyE','NumpadEnter','Mouse0'],
  buy:['KeyJ','Space','Enter','NumpadEnter','Mouse0'], close:['KeyE','Escape','KeyP'],
};
const PREVENT = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Tab']);
addEventListener('keydown', e => { if(PREVENT.has(e.code)) e.preventDefault(); if(!e.repeat) pressedQ[e.code]=true; keys[e.code]=true; initAudio(); });
addEventListener('keyup', e => { keys[e.code]=false; releasedQ[e.code]=true; });
addEventListener('blur', () => { for(const k in keys) keys[k]=false; });
cv.addEventListener('mousedown', e => { e.preventDefault(); cv.focus(); const k='Mouse'+e.button; pressedQ[k]=true; keys[k]=true; initAudio(); });
addEventListener('mouseup', e => { const k='Mouse'+e.button; keys[k]=false; releasedQ[k]=true; });
cv.addEventListener('contextmenu', e => e.preventDefault());
let framePressed = {}, frameReleased = {};
const held = a => BIND[a].some(c=>keys[c]);
const pressed = a => BIND[a].some(c=>framePressed[c]);
const released = a => BIND[a].some(c=>frameReleased[c]);

(function(){ // touch buttons
  const coarse = matchMedia('(pointer: coarse)').matches;
  const tc = document.getElementById('touch');
  if(coarse) tc.classList.add('on');
  tc.querySelectorAll('.tb').forEach(b => {
    const k=b.dataset.k;
    const on = e=>{ e.preventDefault(); if(!keys[k]) pressedQ[k]=true; keys[k]=true; b.classList.add('down'); initAudio(); };
    const off= e=>{ e.preventDefault(); if(keys[k]) releasedQ[k]=true; keys[k]=false; b.classList.remove('down'); };
    b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off,{passive:false});
    b.addEventListener('touchcancel',off,{passive:false});
  });
})();

const padPrev = {};
function pollPad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = pads && [...pads].find(p=>p);
  if(!gp) return;
  const ax = gp.axes[0]||0, ay = gp.axes[1]||0, b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const map = { pl: ax<-.4||b(14), pr: ax>.4||b(15), pu: ay<-.5||b(12), pd: ay>.5||b(13),
    pj: b(0), ps: b(2)||b(7), pk: b(1)||b(5), pe: b(3), pm: b(8), pp: b(9) };
  for(const k in map){ if(map[k] && !padPrev[k]) pressedQ[k]=true; if(!map[k] && padPrev[k]) releasedQ[k]=true; keys[k]=map[k]; padPrev[k]=map[k]; }
}
BIND.left.push('pl'); BIND.right.push('pr'); BIND.up.push('pu'); BIND.down.push('pd'); BIND.jump.push('pj');
BIND.shoot.push('ps'); BIND.dash.push('pk'); BIND.act.push('pe'); BIND.map.push('pm'); BIND.pause.push('pp'); BIND.ok.push('pj','pe'); BIND.buy.push('pj'); BIND.close.push('pe','pp');

// ---------------------------------------------------------------- audio
let actx = null, master = null, noiseBuf = null;
function initAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext||window.webkitAudioContext)(); master = actx.createGain(); master.gain.value=.4; master.connect(actx.destination); } catch(e){ actx=null; }
}
function tone(f0,f1,dur,type='square',vol=.07,delay=0){
  if(!actx) return; const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol=.1,freq=1200,type='bandpass',delay=0){
  if(!actx) return;
  if(!noiseBuf){ noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t=actx.currentTime+delay, s=actx.createBufferSource(), fl=actx.createBiquadFilter(), g=actx.createGain();
  s.buffer=noiseBuf; fl.type=type; fl.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02);
}

const cellRoom = {};               // "cx,cy" -> індекс кімнати
ROOMS.forEach((r,i)=>{ for(let x=0;x<r.cw;x++) for(let y=0;y<r.ch;y++) cellRoom[(r.cx+x)+','+(r.cy+y)] = i; });
const ENT = [];                    // вороги/боси з карти {c,x,y,room}
const ITEMS = [];                  // предмети {c,x,y,id,room}
const STATIONS = [];
const ENEMY_CH = 'cotgfdBZ', ITEM_CH = 'DMCJHWR';
(function parse(){
  const g = WORLD.grid.map(r=>r.split(''));
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){
    const c = g[y][x];
    if(ENEMY_CH.includes(c)){ ENT.push({c,x,y,room:roomIndexAt(x,y)}); g[y][x]='.'; }
    else if(ITEM_CH.includes(c)){ ITEMS.push({c,x,y,id:c+x+','+y,room:roomIndexAt(x,y)}); g[y][x]='.'; }
    else if(c==='S'){ STATIONS.push({x,y,room:roomIndexAt(x,y)}); g[y][x]='.'; }
  }
  WORLD.base = g.map(r=>r.join(''));
})();
function roomIndexAt(tx,ty){ const k=Math.floor(tx/CW)+','+Math.floor(ty/CH); return k in cellRoom ? cellRoom[k] : -1; }
const START = STATIONS.find(s => ROOMS[s.room].key==='lift');
const SECRET_TOTAL = ITEMS.filter(i=>'HWR'.includes(i.c)).length;

    const [cx,cy] = k.split(',').map(Number), r = cellRoom[k];
    const rr = cellRoom[(cx+1)+','+cy];
    if(rr!==undefined && rr!==r){ const x = (cx+1)*CW; let found=null;
      for(let y=cy*CH;y<(cy+1)*CH;y++){ const a=g[y][x-1], b=g[y][x]; if(a!=='#' && b!=='#'){ found = kind(a)!=='.'?kind(a):kind(b); break; } }
      if(found) LINKS.push({cx,cy,dir:'r',kind:found}); }
    const rd = cellRoom[cx+','+(cy+1)];
    if(rd!==undefined && rd!==r){ const y = (cy+1)*CH; let found=null;
      for(let x=cx*CW;x<(cx+1)*CW;x++){ const a=g[y-1][x], b=g[y][x]; if(a!=='#' && b!=='#'){ found = kind(a)!=='.'?kind(a):kind(b); break; } }
      if(found) LINKS.push({cx,cy,dir:'d',kind:found}); }
  }
})();

// ---------------------------------------------------------------- tiles
let sealed = false;
const tileAt = (tx,ty) => (tx<0||ty<0||tx>=WW||ty>=WH) ? '#' : grid[ty][tx];
const isSolidCh = c => c==='#' || c==='x' || c==='b' || (c==='L' && sealed);
const solidAt = (tx,ty) => isSolidCh(tileAt(tx,ty));

function moveBody(b, dt, oneway=true){
  const res = { ground:false, wall:0, ceil:false };
  b.x += b.vx*dt;
  let y0=Math.floor(b.y/T), y1=Math.floor((b.y+b.h-0.01)/T);
  if(b.vx>0){ const tx=Math.floor((b.x+b.w)/T); for(let y=y0;y<=y1;y++) if(solidAt(tx,y)){ b.x=tx*T-b.w; b.vx=0; res.wall=1; res.wx=tx; res.wy=y; break; } }
  else if(b.vx<0){ const tx=Math.floor(b.x/T); for(let y=y0;y<=y1;y++) if(solidAt(tx,y)){ b.x=(tx+1)*T; b.vx=0; res.wall=-1; res.wx=tx; res.wy=y; break; } }
  const prevBottom = b.y+b.h;
  b.y += b.vy*dt;
  const x0=Math.floor(b.x/T), x1=Math.floor((b.x+b.w-0.01)/T);
  if(b.vy>0){ const ty=Math.floor((b.y+b.h)/T);
    for(let x=x0;x<=x1;x++){ const c=tileAt(x,ty);
      if(isSolidCh(c) || (oneway && c==='=' && !(b.drop>0) && prevBottom<=ty*T+1)){ b.y=ty*T-b.h; b.vy=0; res.ground=true; break; } } }
  else if(b.vy<0){ const ty=Math.floor(b.y/T); for(let x=x0;x<=x1;x++) if(solidAt(x,ty)){ b.y=(ty+1)*T; b.vy=0; res.ceil=true; break; } }
  return res;
}
function touchesTile(b, ch){
  const x0=Math.floor(b.x/T), x1=Math.floor((b.x+b.w-1)/T), y0=Math.floor(b.y/T), y1=Math.floor((b.y+b.h-1)/T);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(tileAt(x,y)===ch){ if(ch!=='^' || b.y+b.h>y*T+12) return {x,y}; }
  return null;
}
function floodGroup(x,y,ch){
  const out=[], seen=new Set(), st=[[x,y]];
  while(st.length){ const [cx,cy]=st.pop(), k=cx+','+cy; if(seen.has(k)) continue; seen.add(k);
    if(tileAt(cx,cy)!==ch) continue; out.push([cx,cy]); st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]); }
  return out;
}
function breakGroup(x,y){
  const ch = tileAt(x,y);
  for(const [cx,cy] of floodGroup(x,y,ch)){ grid[cy][cx]='.'; S.broken[cx+','+cy]=true;
    puff(cx*T+T/2, cy*T+T/2, 6, {color: ch==='b'?'#6fb6ff':'#a0704a', g:900, max:260, size:6, life:.9}); }
  SFX.brk(); game.shake = 9;
}
function lineOfSight(x0,y0,x1,y1){
  const n = Math.ceil(Math.hypot(x1-x0,y1-y0)/12);
  for(let i=1;i<n;i++){ const t=i/n; if(solidAt(Math.floor(lerp(x0,x1,t)/T), Math.floor(lerp(y0,y1,t)/T))) return false; }
  return true;
}

function puff(x,y,n,o={}){

    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.25,o.life||.6),max:o.life||.6,size:rnd(2,o.size||4),color:o.color||'#fff',g:o.g!=null?o.g:300});

}

function enterRoom(force){
  const p = player;
  const idx = roomIndexAt(Math.floor((p.x+p.w/2)/T), Math.floor((p.y+p.h/2)/T));

  for(const e of ENT) if(e.room===idx){
    if((e.c==='B'||e.c==='Z') && S.bosses[e.c]) continue;
    enemies.push(makeEnemy(e.c, e.x, e.y));
  }
  roomItems = ITEMS.filter(it => it.room===idx && !S.taken[it.id] && !(it.c==='C' && !S.bosses.B));
  if(r.region!==prevRegion) game.regionTitle = { text:REGIONS[r.region].name, sub:r.name, t:2.6 };
  else game.regionTitle = { text:'', sub:r.name, t:1.6 };

// ---------------------------------------------------------------- enemies
function makeEnemy(c,tx,ty){
  const base = { c, flash:0, kb:0, kbv:0, t:Math.random(), dir:Math.random()<.5?-1:1, vx:0, vy:0 };
  const at = (w,h,o) => Object.assign(base, { x:tx*T+T/2-w/2, y:(ty+1)*T-h, w, h }, o);
  switch(c){
    case 'c': return at(28,20,{hp:3, loot:2, name:'Повзун'});
    case 'o': return at(26,24,{hp:3, loot:3, wait:1});
    case 'f': return Object.assign(base,{x:tx*T+4,y:ty*T+4,w:24,h:20,hp:2,loot:2,hx:tx*T+4,hy:ty*T+4});
    case 't': return at(30,26,{hp:4, loot:3, cd:1.5});
    case 'g': return at(28,30,{hp:5, loot:4});
    case 'd': return Object.assign(base,{x:tx*T+4,y:ty*T,w:24,h:20,hp:2,loot:2,state:'hang'});
    case 'B': return at(72,64,{hp:44, maxHp:44, loot:0, state:'sleep', boss:true, name:'СТОРОЖ', wake:0});
    case 'Z': return Object.assign(base,{x:tx*T-14,y:ty*T-14,w:60,h:60,hp:70,maxHp:70,loot:0,state:'sleep',boss:true,name:'ЯДРО',wake:0,cx0:tx*T+16,cy0:ty*T+16,ang:0});
  }
}
function enemyCenter(e){ return {x:e.x+e.w/2, y:e.y+e.h/2}; }

function damageEnemy(e, dmg, fromX, kind){
  // щит щитоносця
  if(e.c==='g' && kind==='shot'){
    const front = (fromX - (e.x+e.w/2)) * e.dir > 0;
    if(front){ SFX.deflect(); puff(e.dir>0?e.x+e.w:e.x, e.y+e.h/2, 5, {color:'#cde'}); return false; }
  }
  if(e.c==='Z' && e.shield>0 && kind!=='drill'){ SFX.deflect(); return false; }
  e.hp -= dmg; e.flash = .1; SFX.hit();
  if(!e.boss){ e.kb = .12; e.kbv = (e.x+e.w/2 > fromX ? 1 : -1)*180; }
  game.hitstop = Math.max(game.hitstop, .03);
  if(e.hp<=0){
    e.dead = true; S.kills++; SFX.kill(); game.shake = Math.max(game.shake, 4);
    const c = enemyCenter(e);
    puff(c.x, c.y, 18, {color:'#ffd34d', max:260});
    for(let i=0;i<e.loot;i++) drops.push({kind:'s', x:c.x, y:c.y, vx:rnd(-140,140), vy:rnd(-380,-180), w:8, h:8, t:0});
    if(!e.boss && Math.random()<.22) drops.push({kind:'h', x:c.x, y:c.y, vx:rnd(-60,60), vy:-300, w:12, h:12, t:0});
    if(e.boss) bossDefeated(e);
  }
  return true;
}

function updateEnemies(dt){
  const p = player, pc = {x:p.x+p.w/2, y:p.y+p.h/2};
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.dead){ enemies.splice(i,1); continue; }
    e.t += dt; e.flash -= dt; e.kb -= dt;
    const ec = enemyCenter(e), dx = pc.x-ec.x, dy = pc.y-ec.y, dist = Math.hypot(dx,dy);
    switch(e.c){
      case 'c': {
        e.vx = e.kb>0 ? e.kbv : e.dir*60; e.vy += G*dt;
        const r = moveBody(e,dt);
        if(e.kb<=0){ if(r.wall) e.dir*=-1; else if(r.ground){ const ax=e.dir>0?e.x+e.w+2:e.x-2, atx=Math.floor(ax/T);
          const below=tileAt(atx,Math.floor((e.y+e.h+4)/T)), at=tileAt(atx,Math.floor((e.y+e.h-4)/T));
          if((!isSolidCh(below)&&below!=='=')||at==='^') e.dir*=-1; } }
        break; }
      case 'o': {
        e.vy += G*dt; if(e.kb>0) e.vx = e.kbv;
        const r = moveBody(e,dt);
        if(r.ground){ e.vx = lerp(e.vx,0,dt*12); e.wait -= dt;
          if(e.wait<=0 && dist<380){ e.dir = dx>0?1:-1; e.vy = -620; e.vx = e.dir*clamp(Math.abs(dx)*1.2,120,260); e.wait = 1.1; } }
        break; }
      case 'f': {
        if(e.kb>0){ e.vx=e.kbv; e.vy*=.9; }
        else if(dist<300 && !p.dead){ e.vx = lerp(e.vx, dx/dist*130, dt*2.5); e.vy = lerp(e.vy, dy/dist*130+Math.sin(e.t*5)*40, dt*2.5); }
        else { e.vx = lerp(e.vx,(e.hx-e.x)*.8,dt*2); e.vy = lerp(e.vy,(e.hy-e.y)*.8+Math.sin(e.t*2)*30,dt*2); }
        moveBody(e,dt,false); break; }
      case 't': {
        e.cd -= dt; e.dir = dx>0?1:-1;
        if(e.cd<=0 && dist<460 && !p.dead && lineOfSight(ec.x,e.y+6,pc.x,pc.y)){
          e.cd = 1.7; SFX.shot();
          const a = Math.atan2(pc.y-(e.y+6), pc.x-ec.x);
          ebullets.push({x:ec.x, y:e.y+6, vx:Math.cos(a)*280, vy:Math.sin(a)*280, r:6, life:3, col:'#ff6a4d'});
        }
        break; }
      case 'g': {
        e.vy += G*dt;
        if(e.kb>0) e.vx = e.kbv*.4; else { if(Math.abs(dx)>8 && dist<420) e.dir = dx>0?1:-1; e.vx = dist<420 ? e.dir*45 : 0; }
        const r = moveBody(e,dt);
        if(r.ground && e.kb<=0){ const ax=e.dir>0?e.x+e.w+2:e.x-2, atx=Math.floor(ax/T), below=tileAt(atx,Math.floor((e.y+e.h+4)/T)), at=tileAt(atx,Math.floor((e.y+e.h-4)/T));
          if((!isSolidCh(below)&&below!=='=')||at==='^'){ e.x -= e.vx*dt; } }
        break; }
      case 'd': {
        if(e.state==='hang'){ if(Math.abs(dx)<50 && dy>0 && dy<400) { e.state='fall'; } }
        else { e.vy += G*dt; if(e.kb>0) e.vx=e.kbv; else e.vx = e.state==='walk' ? e.dir*70 : 0;
          const r = moveBody(e,dt);
          if(r.ground && e.state==='fall'){ e.state='walk'; e.dir = dx>0?1:-1; puff(ec.x,e.y+e.h,6,{color:'#aaa'}); }
          if(e.state==='walk' && r.wall) e.dir*=-1; }
        break; }
      case 'B': updateWarden(e,dt,dx,dist); break;
      case 'Z': updateCore(e,dt,dx,dy,dist); break;
    }
    if(!e.dead && !p.dead && p.inv<=0 && p.dashT<=0 && overlap(shrink(e,3), shrink(p,3)) && !(e.state==='sleep')) hurtPlayer(ec.x);
  }
}

// ---------------------------------------------------------------- bosses
function wakeBoss(b){
  b.state='idle'; b.t=0; sealed = true; SFX.boom(); game.shake = 12;
  game.banner = { title:b.name, sub: b.c==='B' ? 'бойовий робот охорони шахти' : 'збожеволіле серце шахти', t:2.5 };
}
function updateWarden(b, dt, dx, dist){
  const p = player, ph2 = b.hp <= b.maxHp/2;
  const grav = () => { b.vy += G*dt; return moveBody(b,dt,false); };
  if(b.state==='sleep'){ grav(); if(p.onGround && player.x > (ROOMS[game.roomIdx].x+2)*T){ b.wake += dt; if(b.wake>.4) wakeBoss(b); } return; }
  b.t += dt;
  const face = () => b.dir = dx>0?1:-1;
  switch(b.state){
    case 'idle': b.vx = lerp(b.vx,0,dt*8); grav(); face();
      if(b.t > (ph2?.5:.9)){ const opts=['charge','slam','burst'].filter(s=>s!==b.last); b.last = opts[Math.floor(Math.random()*opts.length)]; b.state=b.last+'W'; b.t=0; }
      break;
    case 'chargeW': grav(); face(); if(b.t>(ph2?.35:.55)){ b.state='charge'; b.t=0; SFX.dash(); } break;
    case 'charge': { b.vx = b.dir*(ph2?600:480); const r = grav();
      if(r.wall || b.t>2.5){ b.state='stun'; b.t=0; game.shake=10; SFX.boom(); b.vx=-b.dir*150; b.vy=-280; } break; }
    case 'stun': b.vx = lerp(b.vx,0,dt*4); grav(); if(b.t>(ph2?.6:1)) { b.state='idle'; b.t=0; } break;
    case 'slamW': grav(); face(); if(b.t>.35){ b.state='slam'; b.t=0; b.vy=-900; b.vx = clamp(dx/(1800/G),-520,520); SFX.jump(); } break;
    case 'slam': { const r = grav();
      if(r.ground && b.t>.1){ b.state='idle'; b.t=-.3; b.vx=0; game.shake=14; SFX.boom();
        const n = ph2?2:1; for(let k=0;k<n;k++) for(const s of [-1,1]) ebullets.push({wave:true, x:b.x+b.w/2+s*30, y:b.y+b.h, vx:s*(300+k*150), vy:0, r:12, life:3, col:'#ffb04d'}); }
      break; }
    case 'burstW': grav(); face(); b.vx=0; if(b.t>.5){ b.state='burst'; b.t=0; b.shots=0; } break;
    case 'burst': grav();
      if(b.t > b.shots*(ph2?.1:.16) && b.shots < (ph2?9:6)){
        const n = ph2?9:6, a0 = Math.atan2((p.y+p.h/2)-(b.y+20), (p.x+p.w/2)-(b.x+b.w/2)), a = a0+(b.shots-(n-1)/2)*.14;
        ebullets.push({x:b.x+b.w/2+b.dir*30, y:b.y+20, vx:Math.cos(a)*320, vy:Math.sin(a)*320, r:7, life:4, col:'#ff6a4d'}); b.shots++; SFX.shot(); }
      if(b.t>1.3){ b.state='idle'; b.t=0; } break;
  }
}
function updateCore(b, dt, dx, dy, dist){
  const p = player, ph2 = b.hp <= b.maxHp/2;
  if(b.state==='sleep'){ if(p.onGround && player.x > (ROOMS[game.roomIdx].x+3)*T){ b.wake += dt; if(b.wake>.4) wakeBoss(b); } return; }
  b.t += dt; b.ang += dt*(ph2?1.6:1.1);
  const r = ROOMS[game.roomIdx];
  const cx = (r.x + r.w/2)*T, cy = (r.y + 6)*T;
  b.x = cx + Math.sin(b.ang)*260 - b.w/2; b.y = cy + Math.sin(b.ang*2)*60 - b.h/2;
  b.shield = Math.max(0,(b.shield||0)-dt);
  b.cd = (b.cd||1.5) - dt;
  if(b.cd<=0){
    const pat = (b.pat = ((b.pat||0)+1) % 3);
    const ex = b.x+b.w/2, ey = b.y+b.h/2;
    if(pat===0){ const n = ph2?16:12; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+b.t; ebullets.push({x:ex,y:ey,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:7,life:4,col:'#d6b3ff'}); } SFX.big(); b.cd = ph2?1.4:1.9; }
    else if(pat===1){ for(let k=0;k<(ph2?5:3);k++){ const a=Math.atan2(dy,dx)+(k-(ph2?2:1))*.18; ebullets.push({x:ex,y:ey,vx:Math.cos(a)*330,vy:Math.sin(a)*330,r:6,life:4,col:'#ff6a9a'}); } SFX.shot(); b.cd = ph2?.9:1.3; }
    else { b.shield = 2.2; if(enemies.length < (ph2?5:4)){ const f=makeEnemy('f', Math.floor(ex/T), Math.floor(ey/T)); f.hx=ex; f.hy=ey-60; enemies.push(f); } b.cd = 2.4; }
  }
}
function bossDefeated(b){
  S.bosses[b.c] = true; sealed = false; ebullets = []; game.shake = 20; game.flash = 1; SFX.boom();
  puff(b.x+b.w/2, b.y+b.h/2, 70, {color:'#ffd34d', max:420, size:6, life:1.4});
  for(let i=0;i<30;i++) drops.push({kind:'s', x:b.x+b.w/2, y:b.y+b.h/2, vx:rnd(-260,260), vy:rnd(-600,-200), w:8, h:8, t:0});
  if(b.c==='B'){ roomItems = ITEMS.filter(it => it.room===game.roomIdx && !S.taken[it.id]); game.banner = {title:'СТОРОЖА ЗНИЩЕНО', sub:'Він щось охороняв...', t:2.5}; }
  if(b.c==='Z'){ S.won = true; game.endT = 3; enemies.forEach(e=>e.dead=true); }
  saveGame(); hasSave = true;
}

// ---------------------------------------------------------------- player
function aimDir(){
  const U = held('up'), D = held('down'), L = held('left'), R = held('right'), p = player;
  if(U && (L||R)) return {x:p.face*.707, y:-.707, k:'d'};
  if(U) return {x:0, y:-1, k:'u'};
  if(D && !p.onGround) return {x:0, y:1, k:'v'};
  return {x:p.face, y:0, k:'f'};
}
function fire(charged){
  const p = player, a = aimDir();
  const ox = p.x+p.w/2 + a.x*16, oy = p.y+12 + a.y*16;
  if(charged){
    bullets.push({x:ox,y:oy,vx:a.x*640,vy:a.y*640,r:10,dmg:4+S.dmg*2,life:.9,charged:true,hit:new Set()});
    SFX.big(); game.shake=4; p.vx -= a.x*120;
  } else {
    bullets.push({x:ox,y:oy,vx:a.x*620,vy:a.y*620,r:4,dmg:1+S.dmg,life:.55,charged:false});
    SFX.shot();
  }
  puff(ox,oy,3,{color:charged?'#7fd0ff':'#ffe27a',g:0,min:20,max:80,life:.2});
}

function updatePlayer(dt){
  const p = player, ab = S.ab;
  if(p.dead) return;
  const L=held('left'), R=held('right'), D=held('down');
  const dir = (R?1:0)-(L?1:0);
  if(pressed('jump')) p.jumpBuf = .13;
  p.jumpBuf-=dt; p.coyote-=dt; p.dashCd-=dt; p.inv-=dt; p.lock-=dt; p.wallLock-=dt; p.fireCd-=dt; p.drop-=dt;

  // ривок-бур
  if(pressed('dash') && ab.drill && p.dashCd<=0 && p.dashT<=0 && (p.onGround||p.airDash) && p.lock<=0){
    if(p.wallDir && !p.onGround) p.face = -p.wallDir; else if(dir) p.face = dir;
    p.dashT = DASH_TIME; p.dashCd = .4; if(!p.onGround) p.airDash=false; p.dashHits = new Set();
    SFX.dash();
  }
  if(p.dashT>0){
    p.dashT -= dt; p.vx = p.face*DASH_SPEED; p.vy = 0;
    // ламає тріснуті блоки попереду
    const fx = p.face>0 ? p.x+p.w+4 : p.x-4;
    for(const yy of [p.y+4, p.y+p.h-4]){ const tx=Math.floor(fx/T), ty=Math.floor(yy/T); if(tileAt(tx,ty)==='x') breakGroup(tx,ty); }
    for(const e of enemies) if(!e.dead && !p.dashHits.has(e) && overlap(shrink(p,-4), e)){ p.dashHits.add(e); damageEnemy(e, 2+S.dmg, p.x+p.w/2, 'drill'); }
    if(Math.random()<.7) puff(p.x+p.w/2-p.face*10, p.y+p.h/2, 1, {color:'#ffd34d', g:0, min:20, max:60, life:.25});
  } else if(p.lock>0){ p.vx *= .92; }
  else {
    const acc = p.wallLock>0 ? 4 : (p.onGround ? 30 : 18);
    p.vx = lerp(p.vx, dir*RUN, clamp(acc*dt,0,1)); if(Math.abs(p.vx)<4 && !dir) p.vx = 0;
    if(dir) p.face = dir;
  }

  const sliding = ab.boots && !p.onGround && p.wallDir!==0 && dir===p.wallDir && p.vy>0 && p.dashT<=0;
  if(p.dashT<=0){
    p.vy += G*dt;
    if(p.jumpCut && !held('jump') && p.vy<0) p.vy += G*1.6*dt;
    if(sliding) p.vy = Math.min(p.vy, 110);
    p.vy = Math.min(p.vy, MAXFALL);
  }

  if(p.jumpBuf>0 && p.lock<=0){
    if((p.onGround||p.coyote>0) && D && standingOnOneWay()){ p.drop=.25; p.jumpBuf=0; }
    else if(p.onGround||p.coyote>0){ p.vy=-JUMP; p.jumpBuf=0; p.coyote=0; p.jumpCut=true; p.dashT=0; SFX.jump(); }
    else if(ab.boots && p.wallDir!==0){ p.vy=-700; p.vx=-p.wallDir*320; p.face=-p.wallDir; p.wallLock=.15; p.jumpBuf=0; p.jumpCut=true; p.dashT=0; SFX.jump();
      puff(p.wallDir>0?p.x+p.w:p.x, p.y+p.h/2, 6, {color:'#9fd'}); }
    else if(ab.jet && p.canJet){ p.vy=-DJUMP; p.canJet=false; p.jumpBuf=0; p.jumpCut=true; p.dashT=0; SFX.jet();
      puff(p.x+p.w/2, p.y+p.h, 14, {angle:Math.PI/2, spread:.5, color:'#ff9c4d', g:0, min:80, max:220, life:.35}); }
  }

  // стрільба / заряд
  if(pressed('shoot') && p.fireCd<=0){ fire(false); p.fireCd = Math.max(.1, .22 - S.rate*.05); p.charge = 0; }
  if(held('shoot')){
    if(ab.charge){ p.charge += dt; if(p.charge>.75 && Math.random()<.4) puff(p.x+p.w/2+p.face*14, p.y+12, 1, {color:'#7fd0ff', g:0, min:10, max:40, life:.2}); if(p.charge>.75 && !p.chargedSnd){ p.chargedSnd=true; SFX.charge(); } }
    else if(p.fireCd<=0){ fire(false); p.fireCd = Math.max(.1, .22 - S.rate*.05); }
  }
  if(released('shoot')){ if(ab.charge && p.charge>.75) fire(true); p.charge = 0; p.chargedSnd=false; }

  const wasGround = p.onGround, vyB = p.vy;
  const res = moveBody(p, dt);
  p.onGround = res.ground;
  if(res.ceil) p.jumpCut=false;
  if(p.onGround){ p.coyote=.1; p.canJet=true; p.airDash=true; if(!wasGround && vyB>450){ SFX.land(); puff(p.x+p.w/2,p.y+p.h,6,{angle:-Math.PI/2,spread:1.3,color:'#999',max:100}); } }
  p.wallDir = 0;
  if(!p.onGround){
    const ym=Math.floor((p.y+5)/T), yb=Math.floor((p.y+p.h-5)/T);
    if(solidAt(Math.floor((p.x+p.w+2)/T),ym) && solidAt(Math.floor((p.x+p.w+2)/T),yb)) p.wallDir = 1;
    else if(solidAt(Math.floor((p.x-2)/T),ym) && solidAt(Math.floor((p.x-2)/T),yb)) p.wallDir = -1;
  }
  if(p.wallDir && ab.boots && dir===p.wallDir){ p.canJet=true; p.airDash=true; }

  // шипи
  if(touchesTile({x:p.x+3,y:p.y+4,w:p.w-6,h:p.h-4},'^')) hurtPlayer(p.x+p.w/2-p.face, true);
  // фальшиві стіни: відкриваються, коли крізь них проходиш
  const fk = touchesTile(p,'%');
  if(fk && !S.revealed[fk.x+','+fk.y]){ for(const [x,y] of floodGroup(fk.x,fk.y,'%')) S.revealed[x+','+y]=true;
    SFX.pickup(); game.toast = {text:'Таємний прохід!', t:2}; }

  // безпечна точка для повернення після шипів
  if(p.onGround){
    const fy=Math.floor((p.y+p.h+2)/T), ry=Math.floor((p.y+p.h-2)/T), x0=Math.floor(p.x/T), x1=Math.floor((p.x+p.w)/T);
    let ok = true;
    for(let x=x0-1;x<=x1+1;x++) if(tileAt(x,ry)==='^'||tileAt(x,fy)==='^') ok=false;
    if(!isSolidCh(tileAt(x0,fy)) && tileAt(x0,fy)!=='=') ok=false;
    if(!isSolidCh(tileAt(x1,fy)) && tileAt(x1,fy)!=='=') ok=false;
    if(ok) p.lastSafe = {x:p.x, y:p.y};
  }

  // станції
  const st = nearStation();
  if(st && pressed('act') && p.onGround){ openStation(st); }

  // предмети
  for(let i=roomItems.length-1;i>=0;i--){ const it=roomItems[i];
    if(overlap(p,{x:it.x*T+4,y:it.y*T+4,w:T-8,h:T-8})){ collect(it); roomItems.splice(i,1); } }

  // відвідані клітинки мапи
  const cx = Math.floor((p.x+p.w/2)/T/CW), cy = Math.floor((p.y+p.h/2)/T/CH);
  S.cells[cx+','+cy] = true;
  enterRoom(false);
  p.anim += dt*(p.onGround ? Math.abs(p.vx)/25 : 3);
}
function standingOnOneWay(){
  const p=player, fy=Math.floor((p.y+p.h+2)/T), a=tileAt(Math.floor(p.x/T),fy), b=tileAt(Math.floor((p.x+p.w-1)/T),fy);
  return (a==='='||b==='=') && !isSolidCh(a) && !isSolidCh(b);
}
function nearStation(){
  const p=player; return STATIONS.find(s => Math.abs(p.x+p.w/2-(s.x*T+T/2))<40 && Math.abs(p.y+p.h-(s.y+1)*T)<8);
}

function hurtPlayer(srcX, hazard){
  const p = player;
  if(p.dead || game.fadeDir===1) return;
  if(p.inv>0){ if(hazard) hazardRespawn(); return; }
  p.hp--; p.inv = 1.2; p.lock = .2; p.dashT = 0; p.charge = 0;
  p.vx = (p.x+p.w/2>=srcX?1:-1)*260; p.vy = -360; p.jumpCut=false;
  game.hitstop = .12; game.shake = 8; game.flash = .35; SFX.hurt();
  puff(p.x+p.w/2, p.y+p.h/2, 14, {color:'#ffd34d'});
  if(p.hp<=0){ die(); return; }
  if(hazard) hazardRespawn();
}
function hazardRespawn(){
  const p=player;
  fadeThen(()=>{ if(p.lastSafe){ p.x=p.lastSafe.x; p.y=p.lastSafe.y; } p.vx=0; p.vy=0; p.inv=1; }, .2);
}
function die(){
  const p=player; p.dead=true; S.deaths++;
  puff(p.x+p.w/2, p.y+p.h/2, 40, {color:'#ffd34d', max:320, life:1});
  game.banner = {title:'СИСТЕМИ ВИМКНЕНО', sub:'', t:1.6};
  setTimeout(()=>fadeThen(()=>{
    const lost = Math.floor(S.scrap*.3); S.scrap -= lost;
    resetPlayer(); const s = S.station || START; spawnAt(s.x, s.y);
    game.banner = {title:'Перезавантаження', sub: lost ? 'Втрачено брухту: '+lost : 'Остання станція', t:2};
  }, .5), 900);
}

const ITEM_INFO = {
  D:{title:'БУР', sub:'K / Shift — ривок. Ламає тріснуті блоки і ранить ворогів.', col:'#ffb04d'},
  M:{title:'МАГНІТНІ ЧЕРЕВИКИ', sub:'Затисни напрямок до стіни — ковзаєш. Стрибок — відштовхнутися.', col:'#6fe08a'},
  C:{title:'ЗАРЯДЖЕНИЙ ПОСТРІЛ', sub:'Затисни J і відпусти. Пробиває синю броню.', col:'#6fb6ff'},
  J:{title:'РЕАКТИВНИЙ РАНЕЦЬ', sub:'Стрибни ще раз у повітрі.', col:'#ff7a5c'},
  H:{title:'ЕНЕРГОБЛОК', sub:'+1 до максимальної енергії', col:'#ffd34d'},
  W:{title:'МОДУЛЬ ГАРМАТИ', sub:'+1 до шкоди пострілів', col:'#ff6a9a'},
  R:{title:'СХОВАНКА БРУХТУ', sub:'+60 брухту', col:'#c0c0c0'},
};
function collect(it){
  S.taken[it.id] = true; SFX.pickup(); game.flash = .5;
  const info = ITEM_INFO[it.c];
  if(it.c==='D') S.ab.drill = true; if(it.c==='M') S.ab.boots = true; if(it.c==='C') S.ab.charge = true; if(it.c==='J') S.ab.jet = true;
  if(it.c==='H'){ S.maxHp++; player.hp = S.maxHp; }
  if(it.c==='W') S.dmg++;
  if(it.c==='R') S.scrap += 60;
  game.banner = {title:info.title, sub:info.sub, t:3.6};
  puff(it.x*T+T/2, it.y*T+T/2, 30, {color:info.col, max:300});
  saveGame(); hasSave = true;
}

// ---------------------------------------------------------------- station & shop
const SHOP = [
  { name:'Енергоблок +1', desc:'макс. енергія', cost:()=>80+S.hpBought*60, can:()=>S.hpBought<2, buy:()=>{ S.hpBought++; S.maxHp++; player.hp=S.maxHp; } },
  { name:'Підсилювач гармати', desc:'+1 шкода', cost:()=>120, can:()=>S.dmg<3 && !S.boughtDmg, buy:()=>{ S.dmg++; S.boughtDmg=true; } },
  { name:'Охолоджувач', desc:'швидша стрільба', cost:()=>70+S.rate*50, can:()=>S.rate<2, buy:()=>{ S.rate++; } },
];
function openStation(st){
  player.hp = S.maxHp; S.station = {x:st.x, y:st.y}; saveGame(); hasSave = true; SFX.save();
  game.shop = { sel:0 }; game.toast = {text:'Збережено. Енергію відновлено.', t:2};
}
function updateShop(){
  const sh = game.shop;
  if(pressed('up')){ sh.sel = (sh.sel+SHOP.length)%(SHOP.length+1); SFX.select(); }
  if(pressed('down')){ sh.sel = (sh.sel+1)%(SHOP.length+1); SFX.select(); }
  if(pressed('close') || (pressed('buy') && sh.sel===SHOP.length)){ game.shop=null; return; }
  if(pressed('buy')){
    const it = SHOP[sh.sel];
    if(it.can() && S.scrap>=it.cost()){ S.scrap -= it.cost(); it.buy(); SFX.buy(); saveGame(); game.toast={text:'Встановлено: '+it.name, t:2}; }
    else SFX.deny();
  }
}

// ---------------------------------------------------------------- bullets & drops
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i]; b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt;
    const tx=Math.floor(b.x/T), ty=Math.floor(b.y/T), c=tileAt(tx,ty);
    if(isSolidCh(c)){
      if(c==='b' && b.charged) breakGroup(tx,ty);
      else puff(b.x,b.y,4,{color: c==='b'?'#6fb6ff':'#ffe27a', max:120, life:.25});
      if(c==='b' && !b.charged && !game.toast) game.toast = {text:'Синя броня. Потрібен потужніший постріл.', t:2};
      b.life = 0;
    }
    if(b.life>0) for(const e of enemies){
      if(e.dead || e.state==='sleep') continue;
      if(overlap({x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2}, e)){
        if(b.charged){ if(b.hit.has(e)) continue; b.hit.add(e); damageEnemy(e,b.dmg,b.x-b.vx,'shot'); }
        else { damageEnemy(e,b.dmg,b.x-b.vx*.05,'shot'); b.life=0; break; }
      }
    }
    if(b.life<=0) bullets.splice(i,1);
  }
  const p = player;
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i]; b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.wave){ if(solidAt(Math.floor((b.x+Math.sign(b.vx)*12)/T), Math.floor((b.y-8)/T))) b.life=0; }
    else if(solidAt(Math.floor(b.x/T), Math.floor(b.y/T))){ b.life=0; puff(b.x,b.y,4,{color:b.col,max:100,life:.25}); }
    const hb = b.wave ? {x:b.x-10,y:b.y-26,w:20,h:26} : {x:b.x-b.r+2,y:b.y-b.r+2,w:b.r*2-4,h:b.r*2-4};
    if(!p.dead && p.inv<=0 && p.dashT<=0 && overlap(hb, p)){ hurtPlayer(b.x); b.life=0; }
    if(b.life<=0) ebullets.splice(i,1);
  }
  for(let i=drops.length-1;i>=0;i--){
    const d = drops[i]; d.t += dt;
    const dx=(p.x+p.w/2)-(d.x+d.w/2), dy=(p.y+p.h/2)-(d.y+d.h/2), dist=Math.hypot(dx,dy);
    if(d.t>.35 && dist<120 && !p.dead){ d.vx=lerp(d.vx,dx/dist*520,dt*8); d.vy=lerp(d.vy,dy/dist*520,dt*8); d.x+=d.vx*dt; d.y+=d.vy*dt; }
    else { d.vy += 1400*dt; const r = moveBody(d,dt); if(r.ground) d.vx*=.85; }
    if(dist<18){ if(d.kind==='s'){ S.scrap++; SFX.coin(); } else { if(p.hp<S.maxHp){ p.hp++; SFX.buy(); } else { S.scrap+=3; SFX.coin(); } } drops.splice(i,1); }
    else if(d.t>20) drops.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){ const q=particles[i]; q.life-=dt; if(q.life<=0){ particles.splice(i,1); continue; } q.vy+=q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; }
}

// ---------------------------------------------------------------- flow
function fadeThen(cb,dur=.3){ game.fadeDir=1; game.fadeCb=cb; game.fadeDur=dur; }
function updateFade(dt){
  if(game.fadeDir===1){ game.fade+=dt/game.fadeDur; if(game.fade>=1){ game.fade=1; const cb=game.fadeCb; game.fadeCb=null; game.fadeDir=-1; cb&&cb(); } }
  else if(game.fadeDir===-1){ game.fade-=dt/.25; if(game.fade<=0){ game.fade=0; game.fadeDir=0; } }
}
function camTarget(){
  const p=player, r=ROOMS[game.roomIdx];
  let tx = p.x+p.w/2-VW/2+p.face*30, ty = p.y+p.h/2-VH/2-20;
  const x0=r.x*T, y0=r.y*T, w=r.w*T, h=r.h*T;
  tx = w<=VW ? x0+(w-VW)/2 : clamp(tx,x0,x0+w-VW);
  ty = h<=VH ? y0+(h-VH)/2 : clamp(ty,y0,y0+h-VH);
  return {tx,ty};
}
function snapCam(){ const t=camTarget(); cam.x=t.tx; cam.y=t.ty; }
function updateCam(dt){ const t=camTarget(); cam.x=lerp(cam.x,t.tx,clamp(dt*8,0,1)); cam.y=lerp(cam.y,t.ty,clamp(dt*8,0,1)); }

function newGame(){ S=freshState(); buildGrid(); resetPlayer(); game.roomIdx=-1; spawnAt(START.x, START.y); S.station={x:START.x,y:START.y};
  game.mode='play'; saveGame(); hasSave=true; game.banner={title:'ШАХТА-7', sub:'Знайди і вимкни збожеволіле ядро шахти', t:3.5}; }
function continueGame(){ const s=loadSave(); if(!s) return newGame(); S=Object.assign(freshState(), s); buildGrid(); resetPlayer(); game.roomIdx=-1;
  const st=S.station||START; spawnAt(st.x, st.y); game.mode='play'; }

function step(dt){
  game.t += dt;
  if(game.mode==='title'){ if(pressed('newg')) newGame(); else if(pressed('ok')){ hasSave ? continueGame() : newGame(); } return; }
  if(game.mode==='ending'){ if(pressed('ok')) game.mode='play'; return; }
  if(game.mode==='pause'){ if(pressed('pause')||pressed('ok')) game.mode='play'; else if(pressed('newg')) game.mode='title'; return; }
  if(game.shop){ updateShop(); return; }
  if(pressed('map')) game.showMap = !game.showMap;
  if(pressed('pause')){ if(game.showMap) game.showMap=false; else { game.mode='pause'; return; } }
  if(game.showMap) return;
  updateFade(dt);
  for(const k of ['banner','regionTitle','toast']) if(game[k]){ game[k].t-=dt; if(game[k].t<=0) game[k]=null; }
  game.flash = Math.max(0,game.flash-dt*2); game.shake = Math.max(0,game.shake-dt*30);
  if(game.endT>0){ game.endT-=dt; if(game.endT<=0) game.mode='ending'; }
  if(game.fadeDir===1) return;
  if(game.hitstop>0){ game.hitstop-=dt; return; }
  S.time += dt;
  updatePlayer(dt); updateEnemies(dt); updateBullets(dt); updateCam(dt);
}

// ---------------------------------------------------------------- drawing
function regionOfCam(){ return REGIONS[ROOMS[game.roomIdx].region]; }
function drawTiles(){
  const rg = regionOfCam();
  const x0=Math.max(0,Math.floor(cam.x/T)), y0=Math.max(0,Math.floor(cam.y/T));
  const x1=Math.min(WW-1,Math.floor((cam.x+VW)/T)), y1=Math.min(WH-1,Math.floor((cam.y+VH)/T));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const c = grid[y][x], px=x*T, py=y*T;
    if(c==='#' || (c==='%' && !S.revealed[x+','+y])){
      ctx.fillStyle = rg.wall; ctx.fillRect(px,py,T,T);
      const up = tileAt(x,y-1);
      if(up!=='#' && up!=='%' && up!=='x' && up!=='b'){ ctx.fillStyle = rg.edge; ctx.fillRect(px,py,T,4); }
      if(c==='%'){ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(px+6,py+20,3,3); }
    } else if(c==='%'){ ctx.strokeStyle = rg.edge; ctx.globalAlpha=.35; ctx.setLineDash([4,4]); ctx.strokeRect(px+1,py+1,T-2,T-2); ctx.setLineDash([]); ctx.globalAlpha=1; }
    else if(c==='='){ ctx.fillStyle = rg.edge; ctx.fillRect(px,py,T,5); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(px,py+5,T,2); }
    else if(c==='^'){ ctx.fillStyle = '#e8e8e8'; for(let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(px+k*8,py+T); ctx.lineTo(px+k*8+4,py+T-16); ctx.lineTo(px+k*8+8,py+T); ctx.fill(); } }
    else if(c==='x'){ ctx.fillStyle='#8a5a36'; ctx.fillRect(px,py,T,T); ctx.strokeStyle='#3a2414'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px+4,py+4); ctx.lineTo(px+16,py+14); ctx.lineTo(px+12,py+28); ctx.moveTo(px+16,py+14); ctx.lineTo(px+28,py+8); ctx.stroke(); ctx.strokeRect(px+1,py+1,T-2,T-2); }
    else if(c==='b'){ ctx.fillStyle='#2f6fd0'; ctx.fillRect(px,py,T,T); ctx.fillStyle='#6fb6ff'; ctx.fillRect(px+4,py+4,T-8,4); ctx.fillRect(px+4,py+14,T-8,4); ctx.fillRect(px+4,py+24,T-8,4); }
    else if(c==='L' && sealed){ ctx.fillStyle='#401a10'; ctx.fillRect(px,py,T,T); ctx.fillStyle='#ff7a3a'; for(let k=0;k<3;k++) ctx.fillRect(px+4+k*10,py,4,T); }
  }
}
function drawPlayer(){
  const p = player; if(p.dead) return;
  if(p.inv>0 && Math.floor(p.inv*16)%2===0) return;
  const f = p.face, x = p.x, y = p.y;
  if(p.dashT>0){ ctx.fillStyle='rgba(255,211,77,.3)'; ctx.fillRect(x-f*18,y+6,p.w,p.h-10); }
  // ноги
  const ph = p.onGround && Math.abs(p.vx)>20 ? Math.sin(p.anim)*4 : 0;
  ctx.fillStyle = '#3a3f4a'; ctx.fillRect(x+3+ph*.5,y+p.h-7,5,7); ctx.fillRect(x+p.w-8-ph*.5,y+p.h-7,5,7);
  // корпус
  ctx.fillStyle = '#ffcf3a'; ctx.fillRect(x, y+6, p.w, p.h-12);
  ctx.fillStyle = '#d9a520'; ctx.fillRect(x, y+p.h-9, p.w, 3);
  // голова + візор
  ctx.fillStyle = '#e8e8ea'; ctx.fillRect(x+2, y-2, p.w-4, 10);
  ctx.fillStyle = '#28d3ff'; ctx.fillRect(f>0 ? x+9 : x+3, y+1, 8, 4);
  // ранець
  if(S.ab.jet){ ctx.fillStyle='#ff7a5c'; ctx.fillRect(f>0?x-5:x+p.w, y+8, 5, 12); }
  // гармата
  const a = aimDir(); ctx.save(); ctx.translate(x+p.w/2, y+12); ctx.rotate(Math.atan2(a.y,a.x));
  ctx.fillStyle = p.charge>.75 ? (Math.floor(game.t*20)%2?'#7fd0ff':'#fff') : '#5a6070'; ctx.fillRect(4,-3,14,6); ctx.restore();
  if(S.ab.drill){ ctx.fillStyle='#c0c4cc'; ctx.beginPath(); const bx = f>0?x+p.w:x; ctx.moveTo(bx, y+16); ctx.lineTo(bx+f*8, y+20); ctx.lineTo(bx, y+24); ctx.fill(); }

      ctx.save(); ctx.translate(x+e.w/2,y+6); const a=Math.atan2(player.y+14-(y+6), player.x+10-(x+e.w/2)); ctx.rotate(a); ctx.fillStyle='#333'; ctx.fillRect(0,-3,16,6); ctx.restore();

    case 'B': { ctx.fillStyle=C('#8e2a1e'); ctx.fillRect(x,y+10,e.w,e.h-18); ctx.fillStyle=C('#c0392b'); ctx.fillRect(x+10,y,e.w-20,16);
      ctx.fillStyle = e.state.endsWith('W') ? '#ff0' : '#ffd34d'; ctx.fillRect(e.dir>0?x+e.w-24:x+8, y+4, 16, 6);
      ctx.fillStyle='#333'; const lp=e.state==='charge'?Math.sin(game.t*30)*5:0; ctx.fillRect(x+8+lp,y+e.h-8,14,8); ctx.fillRect(x+e.w-22-lp,y+e.h-8,14,8);

function drawMapCells(ox, oy, U, Uh, opts={}){
  const visitedRoom = new Set();
  for(const k in S.cells) if(k in cellRoom) visitedRoom.add(cellRoom[k]);
  for(const k in S.cells){
    if(!(k in cellRoom)) continue;
    const [cx,cy] = k.split(',').map(Number), r = ROOMS[cellRoom[k]];
    ctx.fillStyle = REGIONS[r.region].wall; ctx.fillRect(ox+cx*U, oy+cy*Uh, U, Uh);
  }
  for(const i of visitedRoom){ const r = ROOMS[i];
    ctx.strokeStyle = REGIONS[r.region].edge; ctx.lineWidth = 2; ctx.strokeRect(ox+r.cx*U+1, oy+r.cy*Uh+1, r.cw*U-2, r.ch*Uh-2); }
  for(const l of LINKS){
    const a = l.cx+','+l.cy, b = l.dir==='r' ? (l.cx+1)+','+l.cy : l.cx+','+(l.cy+1);
    if(!S.cells[a] && !S.cells[b]) continue;
    if(l.kind==='%' && !S.cells[a] || l.kind==='%' && !S.cells[b]) continue; // таємні проходи видно лише після проходу
    ctx.fillStyle = l.kind==='x' ? '#b5835c' : l.kind==='b' ? '#6fb6ff' : l.kind==='L' ? '#ff7a3a' : '#fff';
    if(l.dir==='r') ctx.fillRect(ox+(l.cx+1)*U-3, oy+l.cy*Uh+Uh*.55, 6, Uh*.3);
    else ctx.fillRect(ox+l.cx*U+U*.35, oy+(l.cy+1)*Uh-3, U*.3, 6);
  }
  if(opts.icons){
    for(const s of STATIONS){ if(!S.cells[Math.floor(s.x/CW)+','+Math.floor(s.y/CH)]) continue;
      ctx.fillStyle='#6fe08a'; ctx.fillRect(ox+s.x/CW*U-4, oy+s.y/CH*Uh-4, 8, 8); }
    for(const it of ITEMS){ if(S.taken[it.id] || !S.cells[Math.floor(it.x/CW)+','+Math.floor(it.y/CH)]) continue; if(it.c==='C' && !S.bosses.B) continue;
      ctx.fillStyle=ITEM_INFO[it.c].col; ctx.beginPath(); ctx.arc(ox+it.x/CW*U, oy+it.y/CH*Uh, 4, 0, Math.PI*2); ctx.fill(); }
    for(const e of ENT){ if(!(e.c==='B'||e.c==='Z') || S.bosses[e.c] || !S.cells[Math.floor(e.x/CW)+','+Math.floor(e.y/CH)]) continue;
      ctx.fillStyle='#ff3a3a'; ctx.font='bold 14px system-ui'; ctx.textAlign='center'; ctx.fillText('☠', ox+e.x/CW*U, oy+e.y/CH*Uh+5); }
  }
  const px = ox + (player.x+player.w/2)/T/CW*U, py = oy + (player.y+player.h/2)/T/CH*Uh;
  ctx.fillStyle = Math.floor(game.t*4)%2 ? '#fff' : '#ffd34d'; ctx.fillRect(px-3,py-3,6,6);
}

// ---------------------------------------------------------------- loop
const STEP = 1/120; let acc = 0, last = performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>.1) dt=.1;
  pollPad();
  framePressed = pressedQ; frameReleased = releasedQ; pressedQ = {}; releasedQ = {};
  acc += dt; let first = true;
  while(acc>=STEP){ step(STEP); acc-=STEP; if(first){ framePressed={}; frameReleased={}; first=false; } }
  if(first){ Object.assign(pressedQ, framePressed); Object.assign(releasedQ, frameReleased); }
  render(); requestAnimationFrame(frame);
}
function fit(){ const s=Math.min(innerWidth/VW, innerHeight/VH); cv.style.width=Math.floor(VW*s)+'px'; cv.style.height=Math.floor(VH*s)+'px'; }
